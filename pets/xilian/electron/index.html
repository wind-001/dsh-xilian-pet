<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      width: 100%;
      height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      cursor: grab;
    }
    body.dragging { cursor: grabbing; }
    #bubble {
      position: relative;
      max-width: 380px;
      max-height: 150px;
      margin-bottom: 8px;
      background: rgba(30, 26, 54, 0.97);
      color: #f0e9ff;
      border: 1px solid rgba(178, 132, 255, 0.55);
      border-radius: 14px;
      padding: 8px 16px;
      font-size: 13px;
      line-height: 1.5;
      text-align: left;
      white-space: pre-line;
      overflow: auto;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }
    #bubble::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 7px solid transparent;
      border-top-color: rgba(178, 132, 255, 0.55);
    }
    #detail {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(330px, calc(100% - 24px));
      max-height: calc(100% - 24px);
      overflow: auto;
      background: rgba(16, 14, 32, 0.97);
      color: #e8e2ff;
      border: 1px solid rgba(168, 120, 255, 0.55);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 12.5px;
      line-height: 1.7;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      display: none;
      -webkit-app-region: no-drag;
      pointer-events: none;
    }
    #detail.show { display: block; }
    #detail .k { color: #9a8fc8; }
    #detail .row { margin-bottom: 4px; }
    #detail h4 { margin: 0 0 8px; font-size: 13.5px; color: #dcc6ff; }
    #bubble.sticky {
      border-color: #ffb84d;
      background: rgba(64, 36, 14, 0.97);
      color: #ffe9c9;
      box-shadow: 0 0 22px rgba(255, 140, 0, 0.45);
      animation: blink 1.6s ease-in-out infinite;
    }
    #bubble.sticky::after { border-top-color: rgba(255, 150, 40, 0.7); }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    #pet {
      background-repeat: no-repeat;
      image-rendering: auto;
      flex: none;
    }
  </style>
</head>
<body>
  <div id="bubble">💤 等待指令...</div>
  <div id="pet"></div>
  <div id="detail"><h4>📊 任务详情</h4><div id="detail-body"></div></div>
  <script src="renderer.js"></script>
</body>
</html>
