<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      width: 100%;
      height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      cursor: grab;
    }
    body.dragging { cursor: grabbing; }
    #bubble {
      position: relative;
      max-width: 380px;
      max-height: 150px;
      margin-bottom: 10px;
      background: linear-gradient(165deg, rgba(58, 46, 104, 0.96) 0%, rgba(30, 24, 58, 0.97) 100%);
      color: #f0e9ff;
      border: 1px solid rgba(178, 132, 255, 0.45);
      border-radius: 16px;
      padding: 10px 16px 12px;
      font-size: 13px;
      line-height: 1.6;
      text-align: left;
      white-space: pre-line;
      overflow: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.09);
      pointer-events: none;
      scrollbar-width: thin;
      scrollbar-color: rgba(178, 132, 255, 0.45) transparent;
    }
    #bubble::-webkit-scrollbar { width: 6px; }
    #bubble::-webkit-scrollbar-thumb { background: rgba(178, 132, 255, 0.4); border-radius: 3px; }
    #bubble::-webkit-scrollbar-thumb:hover { background: rgba(178, 132, 255, 0.65); }
    #bubble::-webkit-scrollbar-track { background: transparent; }
    #b-head { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    #b-head .b-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
    #b-head.running .b-dot { background: #7cc4ff; box-shadow: 0 0 6px #7cc4ff; }
    #b-head.waiting .b-dot { background: #ffb84d; box-shadow: 0 0 6px #ffb84d; }
    #b-head.review .b-dot { background: #6fe3a1; box-shadow: 0 0 6px #6fe3a1; }
    #b-head.degraded .b-dot { background: #ff8fa3; box-shadow: 0 0 6px #ff8fa3; }
    #b-head.idle .b-dot { background: #9aa4ff; box-shadow: 0 0 6px #9aa4ff; }
    #b-head .b-title { font-size: 12px; font-weight: 600; letter-spacing: 0.5px; color: #dcc6ff; }
    #b-body { font-size: 13px; white-space: pre-line; }
    #b-bar { margin-top: 8px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.1); overflow: hidden; display: none; }
    #b-bar i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #a678ff, #7cc4ff); transition: width .4s ease; }
    #bubble::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 7px solid transparent;
      border-top-color: rgba(178, 132, 255, 0.55);
    }
    #detail {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(330px, calc(100% - 24px));
      max-height: calc(100% - 24px);
      overflow: auto;
      background: rgba(16, 14, 32, 0.97);
      color: #e8e2ff;
      border: 1px solid rgba(168, 120, 255, 0.55);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 12.5px;
      line-height: 1.7;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      display: none;
      -webkit-app-region: no-drag;
      pointer-events: none;
    }
    #detail.show { display: block; }
    #detail .k { color: #9a8fc8; }
    #detail .row { margin-bottom: 4px; }
    #detail h4 { margin: 0 0 8px; font-size: 13.5px; color: #dcc6ff; }
    #bubble.sticky {
      border-color: #ffb84d;
      background: linear-gradient(165deg, rgba(110, 66, 20, 0.97) 0%, rgba(64, 36, 14, 0.97) 100%);
      color: #ffe9c9;
      box-shadow: 0 0 24px rgba(255, 140, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      animation: blink 1.6s ease-in-out infinite;
    }
    #bubble.sticky #b-head .b-title { color: #ffd9a0; }
    #bubble.sticky::after { border-top-color: rgba(255, 150, 40, 0.7); }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    #pet {
      background-repeat: no-repeat;
      image-rendering: auto;
      flex: none;
    }
  </style>
</head>
<body>
  <div id="bubble">
    <div id="b-head"></div>
    <div id="b-body">💤 等待指令...</div>
    <div id="b-bar"><i></i></div>
  </div>
  <div id="pet"></div>
  <div id="detail"><h4>📊 任务详情</h4><div id="detail-body"></div></div>
  <script src="renderer.js"></script>
</body>
</html>
